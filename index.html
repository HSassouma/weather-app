<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
/>
    <title>weather-app</title>
  </head>
  <body>
   <header class="flex justify-between items-center  px-[70px]">

  <div class="flex items-center mt-[50px] ">
    <div class="relative w-[50px] h-10">
    <i class="fa-solid fa-sun absolute top-0 right-0 text-3xl text-yellow-400"></i>
    <i class="fa-solid fa-cloud absolute bottom-0 left-0 text-4xl text-white "></i>
    </div>
    <h1 class="text-2xl text-white ml-1">WeatherNow</h1>
  </div>

  <div class="flex items-center gap-2 mt-[50px]">
    <i class="fa-solid fa-sun text-3xl text-yellow-400 "></i>
    <p class="text-sm text-white">Real-time weather, worldwide</p>
  </div>
</header>
<section class="mt-16 flex flex-col items-center gap-5">
  <div class="info">
    <h1 class="text-5xl font-semibold text-blue-900">Weather Forecast</h1>
    <p class="text-2xl text-blue-900">Find the weather in your city</p>
  </div>

  <div class="bg-white text-2xl rounded-4xl w-[500px] flex justify-between items-center p-1">
    <div class="flex items-center gap-2">
      <i class="fas fa-search text-blue-950 ml-2"></i>
      <input
        type="text"
        id="recherche"
        placeholder="Search for a city ..."
        class="focus:outline-0"
      />
    </div>

    <button id="btn" class="bg-blue-700 text-white rounded-4xl px-5 py-2 hover:bg-blue-800">
      Search
    </button>
  </div>
  <p id="loading" class="hidden text-7xl text-white mt-3.5 bg-blue-700 rounded-4xl p-3 h-32  ">Searching...</p>
<p id="error" class="hidden text-white bg-red-600 p-2 rounded-3xl text-2xl  mt-2"></p>
</section>

<main id="donnee_weather" class="max-w-6xl mx-auto px-6 py-8">

  <section id="donne_current"
    class=" hidden bg-white/45 backdrop-blur-md border border-white/60 shadow-xl w-full lg:w-2/3 rounded-3xl p-8 md:p-10">
    <div class="flex items-center gap-4 mb-10">
      <i class="fa-solid fa-location-dot text-3xl text-blue-900"></i>
      <h1 id="city-name" class="text-2xl md:text-3xl font-bold text-blue-950">
        Weather in Nador, Morocco
      </h1>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center">
      <div class="flex items-center justify-center gap-6 ml-0">

        <div id="weather-icon" class="text-5xl md:text-8xl text-yellow-400">
          <i class="fa-solid fa-cloud-sun"></i>
        </div>

        <div>
          <h2 id="temperature" class="text-2xl md:text-7xl font-bold text-blue-950">
            25°C
          </h2>

          <p id="description" class="text-xl font-semibold text-blue-950 mt-3">
            Partly cloudy
          </p>
        </div>

      </div>
      <div class="border-t md:border-t-0 md:border-l-2 border-blue-300 pt-6 md:pt-0 md:pl-10 space-y-7">

        <div class="flex items-center gap-5">
          <i class="fa-solid fa-droplet text-3xl text-blue-500"></i>
          <div>
            <p class="text-blue-900">Humidity</p>
            <p id="humidity" class="text-xl font-semibold text-blue-950">64%</p>
          </div>
        </div>

        <div class="flex items-center gap-5">
          <i class="fa-solid fa-wind text-3xl text-blue-600"></i>
          <div>
            <p class="text-blue-900">Wind</p>
            <p id="wind" class="text-xl font-semibold text-blue-950">15 km/h</p>
          </div>
        </div>

        <div class="flex items-center gap-5">
          <i class="fa-solid fa-temperature-half text-3xl text-blue-600"></i>
          <div>
            <p class="text-blue-900">Feels like</p>
            <p id="feels-like" class="text-xl font-semibold text-blue-950">26.5°C</p>
          </div>
        </div>

      </div>

    </div>
  </section>
  <section id="donnee_dely"></section>

</main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
