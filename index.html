<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
/>
    <title>weather-app</title>
  </head>
  <body>
   <header class="flex justify-between items-center  px-[70px]">

  <div class="flex items-center mt-[50px] ">
    <div class="relative w-[50px] h-10">
    <i class="fa-solid fa-sun absolute top-0 right-0 text-3xl text-yellow-400"></i>
    <i class="fa-solid fa-cloud absolute bottom-0 left-0 text-4xl text-white "></i>
    </div>
    <h1 class="text-2xl text-white ml-1">WeatherNow</h1>
  </div>

  <div class="flex items-center gap-2 mt-[50px]">
    <i class="fa-solid fa-sun text-3xl text-yellow-400 "></i>
    <p class="text-sm text-white">Real-time weather, worldwide</p>
  </div>
</header>
<section class="mt-16 flex flex-col items-center gap-5">
  <div class="info">
    <h1 class="text-5xl font-semibold text-blue-900">Weather Forecast</h1>
    <p class="text-2xl text-blue-900">Find the weather in your city</p>
  </div>

  <div class="bg-white text-2xl rounded-4xl w-[500px] flex justify-between items-center p-1">
    <div class="flex items-center gap-2">
      <i class="fas fa-search text-blue-950 ml-2"></i>
      <input
        type="text"
        id="recherche"
        placeholder="Search for a city ..."
        class="focus:outline-0"
      />
    </div>

    <button id="btn" class="bg-blue-700 text-white rounded-4xl px-5 py-2 hover:bg-blue-800">
      Search
    </button>
  </div>
  <p id="loading" class="hidden text-7xl text-white mt-3.5 bg-blue-700 rounded-4xl p-3 h-32  ">Searching...</p>
<p id="error" class="hidden text-white bg-red-600 p-2 rounded-3xl text-2xl  mt-2"></p>
</section>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
